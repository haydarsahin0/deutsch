<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cover Short s05 Beim Arzt</title>
<!-- Shorts cover for s05-beim-arzt („Was sage ich beim Arzt?“ – 4 Sätze; „Ich habe Kopfschmerzen“ statt „Schmerz im Kopf“).
     Own colour world: dark petrol consulting-room wall (eye chart, lamp) over a pink German prescription form („rosa Rezept“)
     that cuts diagonally across the frame; mustard „4“ in a red ink circle.
     Layout: eye chart + B1–C1 top (decoration), „BEIM ARZT“ + giant „4 SÄTZE“, then on the Rezept: struck-out „Schmerz im Kopf“
     and a big green „Kopfschmerzen“, then Melo (ice bag on the head, hand on the temple) and the coconut doctor pointing.
     Key content in the central 1080×1080 (y 420–1500). Append #g to overlay the safe zones.
     node tools/render.js shorts/s05-beim-arzt/cover/cover.html shorts/s05-beim-arzt/out/cover.png 1080 1920 -->
<style>
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../../brand/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-ext-900-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #173a3b; }
  svg { display: block; }
</style>
<script src="../../../brand/concepts/b/melo-b.js"></script>
<script src="../../../brand/channel/scene-ink.js"></script>
<script src="../../../engine/cast/cast.js"></script>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
(async function () {
  await Promise.all(['400 100px Anton', '700 100px Oswald', '900 100px Fraunces'].map(function (f) { return document.fonts.load(f, 'AÄẞ„“!?…–Kopfschmerzen'); }));
  var W = 1080, H = 1920, HASH = (location.hash || '').slice(1);
  var INK = '#14110d', RED = '#c8302a', DRED = '#8f1f1b', MUS = '#E8B53A', PET = '#1d4647', PINK = '#f1cfc8', PINKL = '#f7e0da',
      FORM = '#c96f6a', GRN = '#3f9a52', CREAM = '#f4ecd8';
  var S = new SceneInk(505), U = MeloB._util;
  var defs = '', s = '';
  var cv = document.createElement('canvas').getContext('2d');
  function measure(t, font) { cv.font = font; return cv.measureText(t).width; }
  function f1(v) { return U.f1(v); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function R(a, b) { return S.rand(a, b); }

  defs += '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/>' +
    '<feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 -1.6 .8"/></filter>' +
    '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>' +
    '<filter id="sil" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>' +
    '<feFlood flood-color="#000"/><feComposite in2="d" operator="in"/></filter>' +
    '<filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="10" dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer></filter>' +
    '<radialGradient id="wall" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="#2f6a68"/><stop offset=".55" stop-color="' + PET + '"/><stop offset="1" stop-color="#0e2526"/></radialGradient>' +
    '<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + PINKL + '"/><stop offset="1" stop-color="#e3b4ab"/></linearGradient>' +
    '<radialGradient id="vig" cx="50%" cy="48%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>';

  function word(t, x, y, size, fill, o) {
    o = o || {};
    var sw = size * 0.075, sh = size * 0.055;
    var a = 'x="' + x + '" y="' + y + '" font-family="' + (o.font || 'Anton') + '"' + (o.weight ? ' font-weight="' + o.weight + '"' : '') + ' font-size="' + size + '" text-anchor="' + (o.anchor || 'middle') + '"' + (o.ls ? ' letter-spacing="' + o.ls + '"' : '');
    var g = '<g' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : '') + '>';
    g += '<text ' + a + ' fill="#000" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" opacity=".55" transform="translate(' + f1(sh) + ' ' + f1(sh * 1.3) + ')">' + esc(t) + '</text>';
    g += '<text ' + a + ' fill="' + fill + '" stroke="' + (o.stroke || '#000') + '" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" paint-order="stroke fill">' + esc(t) + '</text>';
    return g + '</g>';
  }
  function brush(pts, w, color, smooth, extra) { return S.line(pts, { w: w, ta: 0.12, tb: 0.25, min: 0.45, jit: 0.2, smooth: smooth || 0 }, color, extra); }
  function tag(x, y, t, bg, fg, size, rot, ls) {
    var w = measure(t, '700 ' + size + 'px Oswald') + size * 0.9 + (ls || 0) * t.length, h = size * 1.42;
    return '<g transform="translate(' + f1(x) + ' ' + f1(y) + ') rotate(' + (rot || 0) + ')">' + S.shape(S.rect(-w / 2, -h / 2, w, h, 30, 1.2), bg, { w: 3.5, extra: 2 }) +
      '<text x="0" y="' + f1(size * 0.36) + '" font-family="Oswald" font-weight="700" font-size="' + size + '"' + (ls ? ' letter-spacing="' + ls + '"' : '') + ' text-anchor="middle" fill="' + fg + '">' + esc(t) + '</text></g>';
  }
  function melo(opts, hx, hy, hh) {
    var m = MeloB.svg(Object.assign({ seed: 11 }, opts));
    var u = 196 / hh;
    var vb = [-hx * u, -388 - hy * u, W * u, H * u].map(function (v) { return Math.round(v * 100) / 100; }).join(' ');
    m = m.replace(/viewBox="[^"]*"/, 'viewBox="' + vb + '" x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none"').replace(/ width="\d+" height="\d+"(?= class)/, '');
    return '<g filter="url(#drop)">' + m + '</g><g filter="url(#sil)">' + m + '</g>' + m;
  }
  function cast(id, o, x, y, r, rot) {
    var f0 = Cast.render(id, Object.assign({ t: 0, seed: 3, scale: 1 }, o));
    var k = r / (f0.anchors.headCenter[1] - f0.anchors.headTop[1]);
    var fr = Cast.render(id, Object.assign({ t: 0, seed: 3, scale: k }, o)), hc = fr.anchors.headCenter;
    var g = '<g transform="translate(' + f1(x - hc[0]) + ' ' + f1(y - hc[1]) + ') rotate(' + (rot || 0) + ' ' + f1(hc[0]) + ' ' + f1(hc[1]) + ')">' + fr.svg + '</g>';
    return '<g filter="url(#drop)">' + g + '</g><g filter="url(#sil)">' + g + '</g>' + g;
  }

  // ── consulting-room wall (petrol, hatched) ─────────────
  s += '<rect width="1080" height="1920" fill="url(#wall)"/>';
  s += S.hatch(S.rect(0, 0, 1080, 1100, 200, 0), { ang: -32, gap: 13, w: 1.2, color: '#081a1a', op: 0.28 });
  s += S.hatch(S.rect(0, 0, 1080, 1100, 200, 0), { ang: 58, gap: 21, w: 1, color: '#081a1a', op: 0.12 });
  // wainscot rail
  s += brush([[-20, 316], [1100, 300]], 6, '#0b1f20', 0, ' opacity=".55"');

  // eye chart (Sehtafel) top-right – decoration only
  var EC = '<g transform="translate(838 34) rotate(3)">';
  EC += '<rect x="12" y="16" width="190" height="262" fill="#000" opacity=".35"/>';
  EC += S.shape(S.rect(0, 0, 190, 262, 30, 1.2), CREAM, { w: 4.5, extra: 2 });
  EC += S.hatch(S.rect(0, 0, 190, 262, 30, 0), { ang: 20, gap: 10, w: 1, op: 0.1 });
  [['E', 70, 72], ['F P', 44, 122], ['T O Z', 30, 162], ['L P E D', 22, 196], ['P E C F D', 16, 224], ['E D F C Z P', 12, 246]].forEach(function (r) {
    EC += '<text x="95" y="' + r[2] + '" font-family="Oswald" font-weight="700" font-size="' + r[1] + '" text-anchor="middle" fill="' + INK + '" letter-spacing="' + (r[1] * 0.12) + '">' + r[0] + '</text>';
  });
  EC += brush([[20, 226], [170, 224]], 2.5, RED);
  EC += '</g>';
  s += EC;
  // pendant lamp top-left-centre
  s += '<circle cx="520" cy="170" r="200" fill="#ffd98a" opacity=".22" filter="url(#glow)"/>';
  s += brush([[520, -10], [520, 92]], 5, INK);
  var shade = [[452, 156], [478, 96], [562, 96], [588, 156]];
  s += S.shape(S.poly(shade, 20, 1.2), '#dfe7df', { w: 4.5, extra: 2 }) + S.hatch(S.poly(shade, 20, 0), { ang: 70, gap: 8, w: 1, op: 0.3 });
  s += '<ellipse cx="520" cy="160" rx="34" ry="10" fill="#fff4c6"/>';
  // B1–C1 tag
  s += '<g transform="translate(64 96) rotate(-3)">' + S.shape(S.rect(0, 0, 150, 62, 30, 1.2), MUS, { w: 3.5, extra: 2 }) +
    '<text x="75" y="46" font-family="Oswald" font-weight="700" font-size="38" text-anchor="middle" fill="' + INK + '">B1–C1</text></g>';
  // stethoscope hanging on a hook (left wall)
  s += '<circle cx="250" cy="200" r="9" fill="#9aa3a2" stroke="' + INK + '" stroke-width="3"/>';
  s += brush([[244, 206], [212, 250], [206, 300], [228, 330]], 7, '#2b2f33', 3) + brush([[256, 206], [288, 250], [292, 296], [266, 330]], 7, '#2b2f33', 3);
  s += S.shape(S.ellipse(247, 344, 24, 24, 20, 0.03), '#b9c2c4', { w: 4 }) + '<circle cx="247" cy="344" r="10" fill="#7d8789"/>';

  // ── headline ───────────────────────────────────────────
  s += word('BEIM ARZT', 540, 604, 188, '#ffffff', { rot: -3 });
  // „4“ in a red ink circle + SÄTZE
  var NX = 300, NY = 1004;
  s += word('4', NX, NY, 370, MUS, { rot: -4 });
  s += word('SÄTZE', 716, NY - 54, 200, '#ffffff', { rot: -4 });
  // red ink circle (two loose loops)
  var ring = [];
  for (var i = 0; i <= 46; i++) { var a = -1.9 + i / 46 * Math.PI * 2.18, rr = 1 + 0.05 * Math.sin(i * 0.7); ring.push([NX + 2 + Math.cos(a) * 158 * rr, NY - 150 + Math.sin(a) * 200 * rr]); }
  s += S.line(ring, { w: 19, ta: 0.08, tb: 0.3, min: 0.35, jit: 0.25, smooth: 3 }, '#000', ' opacity=".35" transform="translate(6 9)"');
  s += S.line(ring, { w: 19, ta: 0.08, tb: 0.3, min: 0.35, jit: 0.25, smooth: 3 }, RED);

  // ── pink prescription form, diagonal across the frame ──
  var pap = [[-40, 1060], [1120, 960], [1120, 1960], [-40, 1960]];
  s += '<g filter="url(#drop)">' + S.fillOnly(S.poly(pap, 40, 2), '#000') + '</g>';
  var paper = S.poly(pap, 40, 2);
  s += S.shape(paper, 'url(#paper)', { w: 6, extra: 3 });
  s += S.hatch(paper, { ang: 22, gap: 11, w: 1, color: '#9b4c46', op: 0.12 });
  // printed form structure (pale red), rotated with the diagonal
  var rot = -4.93;
  var F = '<g transform="rotate(' + rot + ' 0 1060)" opacity=".75">';
  F += '<rect x="34" y="1084" width="380" height="118" fill="none" stroke="' + FORM + '" stroke-width="3"/>';
  F += '<rect x="436" y="1084" width="150" height="118" fill="none" stroke="' + FORM + '" stroke-width="3"/>';
  F += '<rect x="610" y="1084" width="436" height="56" fill="none" stroke="' + FORM + '" stroke-width="3"/>';
  for (var c = 0; c < 9; c++) F += '<rect x="' + (622 + c * 46) + '" y="1150" width="38" height="44" fill="none" stroke="' + FORM + '" stroke-width="2.5"/>';
  F += '<text x="44" y="1112" font-family="Oswald" font-weight="700" font-size="22" fill="' + FORM + '" letter-spacing="2">KRANKENKASSE</text>';
  F += '<text x="620" y="1112" font-family="Oswald" font-weight="700" font-size="22" fill="' + FORM + '" letter-spacing="2">REZEPT</text>';
  for (var l = 0; l < 7; l++) F += '<line x1="34" y1="' + (1540 + l * 52) + '" x2="1046" y2="' + (1540 + l * 52) + '" stroke="' + FORM + '" stroke-width="2" opacity=".6"/>';
  F += '</g>';
  s += F;

  // ✗ „Schmerz im Kopf“ (struck out)
  var WX = 600, WY = 1278, WT = '„Schmerz im Kopf“', WF = 86;
  var ww = measure(WT, '900 ' + WF + 'px Fraunces');
  s += '<g transform="rotate(' + rot + ' ' + WX + ' ' + WY + ')">';
  s += '<text x="' + WX + '" y="' + WY + '" font-family="Fraunces" font-weight="900" font-size="' + WF + '" text-anchor="middle" fill="#3a2522">' + WT + '</text>';
  s += brush([[WX - ww / 2 - 14, WY - 22], [WX + ww / 2 + 16, WY - 34]], 13, RED);
  s += '</g>';
  // red ✗
  var XX = WX - ww / 2 - 70, XY = WY - 20;
  s += brush([[XX - 34, XY - 40], [XX + 34, XY + 34]], 18, RED) + brush([[XX + 32, XY - 42], [XX - 30, XY + 36]], 18, RED);

  // ✓ „Kopfschmerzen“ – big, green
  s += word('Kopfschmerzen', 590, 1448, 138, GRN, { rot: -5 });
  var KX = 118, KY = 1394;
  s += brush([[KX - 64, KY - 6], [KX - 24, KY + 40], [KX + 56, KY - 70]], 30, '#000', 1, ' opacity=".4" transform="translate(5 8)"');
  s += brush([[KX - 64, KY - 6], [KX - 24, KY + 40], [KX + 56, KY - 70]], 26, GRN, 1);

  // ── characters (lower band, figures may run into the decoration zone) ──
  // Melo: ice bag on the head, hand on the temple
  var ph = JSON.parse(JSON.stringify(MeloB._POSES.idle));
  ph.b = { sh: [13, -272], el: [62, -318], wr: [86, -382], hand: { g: 'palm', ang: -120, flip: 0 } };
  ph.tilt = 6;
  var MX = 220, MY = 1690, MH = 184;
  s += melo({ view: 'full', poseParams: ph, expression: 'annoyed', look: [0.6, -0.2], headTilt: 8 }, MX, MY, MH);
  // ice bag
  var bagPts = S.ellipse(0, -4, 80, 44, 36, 0.04);
  var ib = '<g transform="translate(' + (MX - 14) + ' ' + (MY - 60) + ') rotate(12) scale(.95)">';
  ib += '<ellipse cx="6" cy="4" rx="80" ry="44" fill="#000" opacity=".3"/>';
  ib += S.shape(bagPts, '#7fb6c9', { w: 4.5, extra: 2 });
  ib += S.hatch(bagPts, { ang: 40, gap: 9, w: 1.2, color: '#2c5f70', op: 0.5 });
  ib += S.shape(S.rect(-22, -88, 44, 32, 16, 0.8), '#c9ced0', { w: 4, extra: 1 });
  ib += brush([[-40, -30], [-20, -44]], 6, '#e6f4f8');
  ib += '</g>';
  s += ib;
  // pain marks
  s += brush([[MX + 126, MY - 150], [MX + 156, MY - 184], [MX + 142, MY - 140], [MX + 178, MY - 170]], 7, RED, 0);
  s += brush([[MX - 126, MY - 130], [MX - 156, MY - 164], [MX - 142, MY - 122], [MX - 178, MY - 150]], 7, RED, 0);

  // coconut doctor pointing at the right answer
  s += cast('arzt', { expr: 'smug', pose: 'point', flip: true }, 840, 1690, 92, 2);

  s += '<rect width="1080" height="1920" fill="url(#vig)"/><rect width="1080" height="1920" filter="url(#grain)" opacity=".24" style="mix-blend-mode:multiply"/>';
  if (HASH === 'g') s += '<rect x="0" y="420" width="1080" height="1080" fill="none" stroke="#0f0" stroke-width="4" stroke-dasharray="20 12"/><rect x="0" y="1540" width="1080" height="380" fill="#f00" opacity=".18"/><rect x="0" y="0" width="1080" height="180" fill="#f00" opacity=".18"/>';
  document.getElementById('stage').innerHTML = '<defs>' + defs + S.defs + '</defs>' + s;
})();
</script>
</body>
</html>

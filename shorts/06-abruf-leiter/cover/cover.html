<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cover Short 06 v2</title>
<!-- Shorts cover v2 for 06-abruf-leiter (wiedererkennen „Ah ja, kenne ich …“ ✗ vs. abrufen ✓ — the Abruf-Leiter:
     10 Minuten · 1 Stunde · vor dem Schlafen, all on the same day).
     Own colour world: night indigo/violet with a moon (none of the earlier covers uses it). Own layout: no split —
     a tall wooden ladder on the right whose three rungs stick out to the left as signboards (1 · 2 · 3),
     Melo climbing it towards the glowing flashcard „die Kaution“ at the top; the wrong way („Ah ja, kenne ich …“)
     as a crossed-out pale speech bubble at the left. Key content in the central 1080×1080 (y 420–1500).
     Append #g to overlay the safe zones.
     node tools/render.js shorts/06-abruf-leiter/cover/cover.html shorts/06-abruf-leiter/out/cover-v2.png 1080 1920 -->
<style>
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../../brand/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-ext-900-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'FrauncesI'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-900-italic.woff2') format('woff2'); }
  @font-face { font-family: 'FrauncesI'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-ext-900-italic.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #120f2c; }
  svg { display: block; }
</style>
<script src="../../../brand/concepts/b/melo-b.js"></script>
<script src="../../../brand/channel/scene-ink.js"></script>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
(async function () {
  await Promise.all(['400 100px Anton', '700 100px Oswald', '900 100px Fraunces', '900 100px FrauncesI'].map(function (f) { return document.fonts.load(f, 'AÖẞ„“!?…–Kaution'); }));
  var W = 1080, H = 1920, HASH = (location.hash || '').slice(1);
  var INK = '#100c1c', RED = '#E5302A', YEL = '#FFC83A', GREEN = '#3aa84a', PAPER = '#f4ead2', LAV = '#d8d0ea';
  var WOOD = '#7a4f2a', WOODL = '#a87240', WOODD = '#4a2e18';
  var S = new SceneInk(66), U = MeloB._util;
  var defs = '', s = '';
  var cv = document.createElement('canvas').getContext('2d');
  function measure(t, font) { cv.font = font; return cv.measureText(t).width; }
  function f1(v) { return U.f1(v); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function R(a, b) { return S.rand(a, b); }

  defs += '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/>' +
    '<feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .6  0 0 0 -1.6 .8"/></filter>' +
    '<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>' +
    '<filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>' +
    '<filter id="sil" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>' +
    '<feFlood flood-color="#000"/><feComposite in2="d" operator="in"/></filter>' +
    '<filter id="rim" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d"/><feOffset dx="6" dy="-7"/><feGaussianBlur stdDeviation="1.5" result="o"/><feFlood flood-color="#cfc4ff"/><feComposite in2="o" operator="in"/></filter>' +
    '<filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dx="8" dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer></filter>' +
    '<radialGradient id="sky" cx="72%" cy="12%" r="95%"><stop offset="0" stop-color="#5a4596"/><stop offset=".35" stop-color="#2f2365"/><stop offset=".75" stop-color="#17123a"/><stop offset="1" stop-color="#0b0920"/></radialGradient>' +
    '<radialGradient id="moonG" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fff6d6"/><stop offset=".7" stop-color="#efdca6"/><stop offset="1" stop-color="#cdb57a"/></radialGradient>' +
    '<radialGradient id="vig" cx="50%" cy="48%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>' +
    '<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2150"/><stop offset="1" stop-color="#0d0a22"/></linearGradient>';

  function word(t, x, y, size, fill, o) {
    o = o || {};
    var sw = size * 0.08, sh = size * 0.06, fam = o.fam || 'Anton';
    var a = 'x="' + x + '" y="' + y + '" font-family="' + fam + '"' + (o.weight ? ' font-weight="' + o.weight + '"' : '') + ' font-size="' + size + '" text-anchor="' + (o.anchor || 'middle') + '"' + (o.ls ? ' letter-spacing="' + o.ls + '"' : '');
    var g = '<g' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : '') + '>';
    g += '<text ' + a + ' fill="#000" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" transform="translate(' + f1(sh) + ' ' + f1(sh * 1.2) + ')">' + esc(t) + '</text>';
    g += '<text ' + a + ' fill="' + fill + '" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" paint-order="stroke fill">' + esc(t) + '</text>';
    return g + '</g>';
  }
  function brush(pts, w, color, smooth) { return S.line(pts, { w: w, ta: 0.12, tb: 0.25, min: 0.45, jit: 0.2, smooth: smooth || 0 }, color); }
  function tag(x, y, t, bg, fg, size, rot, ls) {
    var w = measure(t, '700 ' + size + 'px Oswald') + size * 0.9 + (ls || 0) * t.length, h = size * 1.42;
    return '<g transform="translate(' + f1(x) + ' ' + f1(y) + ') rotate(' + (rot || 0) + ')">' + S.shape(S.rect(-w / 2, -h / 2, w, h, 30, 1.2), bg, { w: 3.5, extra: 2 }) +
      '<text x="0" y="' + f1(size * 0.36) + '" font-family="Oswald" font-weight="700" font-size="' + size + '"' + (ls ? ' letter-spacing="' + ls + '"' : '') + ' text-anchor="middle" fill="' + fg + '">' + esc(t) + '</text></g>';
  }
  function melo(opts, hx, hy, hh) {
    var m = MeloB.svg(Object.assign({ seed: 11 }, opts));
    var u = 196 / hh;
    var vb = [-hx * u, -388 - hy * u, W * u, H * u].map(function (v) { return Math.round(v * 100) / 100; }).join(' ');
    m = m.replace(/viewBox="[^"]*"/, 'viewBox="' + vb + '" x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none"').replace(/ width="\d+" height="\d+"(?= class)/, '');
    return '<g filter="url(#drop)">' + m + '</g><g filter="url(#rim)">' + m + '</g><g filter="url(#sil)">' + m + '</g>' + m;
  }
  function star(x, y, r, c, op) {
    var d = 'M' + f1(x) + ' ' + f1(y - r) + 'Q' + f1(x) + ' ' + f1(y) + ' ' + f1(x + r) + ' ' + f1(y) + 'Q' + f1(x) + ' ' + f1(y) + ' ' + f1(x) + ' ' + f1(y + r) +
      'Q' + f1(x) + ' ' + f1(y) + ' ' + f1(x - r) + ' ' + f1(y) + 'Q' + f1(x) + ' ' + f1(y) + ' ' + f1(x) + ' ' + f1(y - r) + 'Z';
    return '<path d="' + d + '" fill="' + c + '" opacity="' + op + '"/>';
  }

  // ── sky ───────────────────────────────────────────────
  s += '<rect width="1080" height="1920" fill="url(#sky)"/>';
  s += S.hatch(S.rect(0, 0, 1080, 1920, 200, 0), { ang: -32, gap: 16, w: 1.2, color: '#000', op: 0.13 });
  var dots = '';
  for (var i = 0; i < 260; i++) { var x = R(0, 1080), y = R(0, 1560), rr = R(0.8, 2.6); dots += '<circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1(rr) + '" fill="#efe8ff" opacity="' + f1(R(0.25, 0.8)) + '"/>'; }
  s += dots;
  [[80, 300, 16], [1010, 470, 14], [470, 140, 12], [60, 1050, 12], [995, 1060, 18], [330, 1500, 10], [1020, 1330, 11], [210, 640, 10]].forEach(function (p) { s += star(p[0], p[1], p[2] * 2.2, YEL, 0.25) + star(p[0], p[1], p[2], '#fff6d6', 0.95); });

  // moon (top right, decoration) with glow + craters
  s += '<circle cx="930" cy="150" r="250" fill="#b9a6ff" opacity=".22" filter="url(#glow)"/>';
  s += S.shape(S.ellipse(930, 150, 128, 128, 64, 0.01), 'url(#moonG)', { w: 5, extra: 2 });
  var mclip = S.ellipse(930, 150, 126, 126, 48, 0);
  s += '<path d="M1010 64 A126 126 0 0 1 840 240 A150 150 0 0 0 1010 64Z" fill="#9c8450" opacity=".45"/>';
  s += S.hatch(mclip, { ang: 60, gap: 11, w: 1.1, op: 0.18 });
  [[890, 120, 22], [960, 200, 15], [975, 105, 10], [900, 215, 9]].forEach(function (c) { s += '<path d="' + U.polyD(S.ellipse(c[0], c[1], c[2], c[2] * 0.85, 20, 0.08), true) + '" fill="#c9b27a" opacity=".55"/>' + S.line(S.ellipse(c[0], c[1], c[2], c[2] * 0.85, 20, 0.05, 0.4, 3.4), { w: 3, ta: 0.2, tb: 0.2, min: 0.3 }, INK); });
  s += '<text x="790" y="300" font-family="FrauncesI" font-weight="900" font-size="46" fill="#efe8ff" opacity=".8" transform="rotate(-12 790 300)">z</text><text x="750" y="250" font-family="FrauncesI" font-weight="900" font-size="34" fill="#efe8ff" opacity=".6" transform="rotate(-12 750 250)">z</text>';

  // ground
  s += '<path d="M-20 1585 Q300 1560 540 1572 T1100 1560 L1100 1940 L-20 1940Z" fill="url(#ground)"/>';
  s += brush([[-20, 1586], [300, 1562], [560, 1574], [1100, 1558]], 9, '#000', 4);
  s += S.hatch(S.poly([[0, 1590], [1080, 1565], [1080, 1920], [0, 1920]], 100, 0), { ang: 20, gap: 13, w: 1.3, color: '#000', op: 0.35 });

  // ── headline ──────────────────────────────────────────
  s += '<g transform="translate(64 100) rotate(-3)">' + S.shape(S.rect(0, 0, 150, 62, 30, 1.2), YEL, { w: 3.5, extra: 2 }) +
    '<text x="75" y="46" font-family="Oswald" font-weight="700" font-size="38" text-anchor="middle" fill="' + INK + '">B1–C1</text></g>';
  s += word('DU LERNST', 520, 366, 172, '#ffffff', { rot: -4 });
  s += word('FALSCH!', 540, 604, 262, YEL, { rot: -4 });
  // red double ink underline (scribble) under FALSCH!
  s += '<g transform="rotate(-4 540 612) translate(0 -28)">' + brush([[150, 668], [400, 656], [700, 660], [935, 650]], 16, RED, 4) + brush([[230, 694], [520, 684], [860, 684]], 11, RED, 4) + '</g>';

  // ── the wrong way: pale speech bubble, crossed out ─────
  var BX = 48, BY = 716, BW = 444, BH = 178;
  var bub = S.poly([[BX, BY + 24], [BX + 24, BY], [BX + BW - 24, BY], [BX + BW, BY + 24], [BX + BW, BY + BH - 24], [BX + BW - 24, BY + BH], [BX + 150, BY + BH], [BX + 70, BY + BH + 62], [BX + 96, BY + BH], [BX + 24, BY + BH], [BX, BY + BH - 24]], 26, 1.4);
  s += '<g filter="url(#drop)">' + S.fillOnly(bub, LAV) + '</g>' + S.shape(bub, LAV, { w: 5, extra: 3 });
  s += S.hatch(bub, { ang: 40, gap: 12, w: 1.1, op: 0.12 });
  s += '<text x="' + (BX + 34) + '" y="' + (BY + 76) + '" font-family="FrauncesI" font-weight="900" font-size="60" fill="#3b3352">„Ah ja,</text>';
  s += '<text x="' + (BX + 34) + '" y="' + (BY + 148) + '" font-family="FrauncesI" font-weight="900" font-size="60" fill="#3b3352">kenne ich …“</text>';
  // red ✗ over the bubble's right edge
  var xx = BX + BW - 30, yy = BY + 34;
  s += brush([[xx - 46, yy - 48], [xx + 44, yy + 50]], 24, RED) + brush([[xx + 46, yy - 50], [xx - 44, yy + 48]], 24, RED);
  s += tag(BX + 210, BY + BH + 60, 'NUR ERKENNEN', RED, '#fff', 34, -4, 2);

  // ── the ladder (right) ────────────────────────────────
  var Y0 = 1580, Y1 = 690;
  function lx(y) { return 588 + (Y0 - y) / (Y0 - Y1) * 62; }      // left rail x at height y
  var GAPR = 250;
  function rail(dx) {
    var pts = [[lx(Y0) + dx, Y0], [lx(Y1) + dx, Y1]], w = 30;
    var poly = [[pts[0][0] - w / 2, Y0], [pts[1][0] - w / 2, Y1], [pts[1][0] + w / 2, Y1 - 4], [pts[0][0] + w / 2, Y0]];
    var p = S.poly(poly, 40, 1.2);
    return S.shape(p, WOOD, { w: 4.5, extra: 2 }) + S.hatch(p, { ang: 84, gap: 9, w: 1.2, op: 0.4 }) +
      brush([[pts[0][0] - 6, Y0 - 10], [pts[1][0] - 6, Y1 + 12]], 4, WOODL);
  }
  var rails = rail(0) + rail(GAPR);
  s += '<g filter="url(#drop)">' + rails + '</g>' + rails;
  // small unlabelled rungs between the big ones (texture / ladder read)
  function rung(y, x0, x1, th) {
    var p = S.poly([[x0, y - th / 2], [x1, y - th / 2 - 3], [x1, y + th / 2 - 3], [x0, y + th / 2]], 30, 1.1);
    return S.shape(p, WOOD, { w: 4, extra: 2 }) + S.hatch(p, { ang: 4, gap: 8, w: 1, op: 0.35 }) + brush([[x0 + 8, y - th / 2 + 5], [x1 - 8, y - th / 2 + 2]], 3.5, WOODL);
  }
  [1515, 1310, 1085, 860, 760].forEach(function (y) { s += rung(y, lx(y) + 10, lx(y) + GAPR - 10, 20); });
  [1418, 1196, 968].forEach(function (y) { s += '<g filter="url(#drop)">' + rung(y, lx(y) + 6, lx(y) + GAPR + 14, 34) + '</g>' + rung(y, lx(y) + 6, lx(y) + GAPR + 14, 34); });

  // the 3 big labelled rungs = signboards sticking out to the left
  var RUNGS = [
    { y: 1418, n: '1', big: '10 MINUTEN', small: '' },
    { y: 1196, n: '2', big: '1 STUNDE', small: '' },
    { y: 968, n: '3', big: 'SCHLAFEN', small: 'VOR DEM' }
  ];
  RUNGS.forEach(function (r, i) {
    var y = r.y, xL = 70 + i * 6, xR = lx(y) + 22, th = r.small ? 132 : 116, ty = y - th / 2;
    var p = S.poly([[xL, ty + 10], [xL + 14, ty], [xR, ty - 6], [xR, ty + th - 6], [xL + 10, ty + th], [xL, ty + th - 8]], 34, 1.6);
    s += '<g transform="rotate(' + (i === 1 ? 1.2 : -1.2) + ' ' + xR + ' ' + y + ')">';
    s += '<g filter="url(#drop)">' + S.fillOnly(p, WOOD) + '</g>' + S.shape(p, WOOD, { w: 5, extra: 3 });
    s += S.hatch(p, { ang: 2, gap: 10, w: 1.2, op: 0.35 });
    s += brush([[xL + 18, ty + 12], [xR - 10, ty + 5]], 5, WOODL) + brush([[xL + 20, ty + th - 10], [xR - 12, ty + th - 16]], 5, WOODD);
    // nails
    [[xL + 30, ty + 24], [xL + 30, ty + th - 26]].forEach(function (q) { s += '<circle cx="' + f1(q[0]) + '" cy="' + f1(q[1]) + '" r="5" fill="#2a1a0c"/>'; });
    // number disc
    var cx = xL + 92, cy = y - 2;
    s += S.shape(S.ellipse(cx, cy, 44, 44, 30, 0.05), YEL, { w: 5, extra: 2 }) +
      '<text x="' + cx + '" y="' + (cy + 25) + '" font-family="Anton" font-size="70" text-anchor="middle" fill="' + INK + '">' + r.n + '</text>';
    var tx = cx + 66;
    if (r.small) {
      s += '<text x="' + tx + '" y="' + (y - 22) + '" font-family="Oswald" font-weight="700" font-size="38" letter-spacing="3" fill="' + YEL + '" stroke="#000" stroke-width="7" paint-order="stroke fill" stroke-linejoin="round">' + r.small + '</text>';
      s += word(r.big, tx, y + 50, 80, '#ffffff', { anchor: 'start' });
    } else {
      s += word(r.big, tx, y + 32, 86, '#ffffff', { anchor: 'start' });
    }
    s += '</g>';
  });
  // little crescent moon on sign 3 (between text and rail)
  var mcx = 568, mcy = 950;
  s += '<path d="M' + (mcx + 8) + ' ' + (mcy - 30) + ' A32 32 0 1 0 ' + (mcx + 28) + ' ' + (mcy + 24) + ' A25 25 0 1 1 ' + (mcx + 8) + ' ' + (mcy - 30) + 'Z" fill="' + YEL + '" stroke="#000" stroke-width="5" stroke-linejoin="round"/>';

  // ── the goal: glowing flashcard „die Kaution“ at the top of the ladder ──
  var CX = 800, CY = 742, CT = 'die Kaution', CF = 66;
  var cw = measure(CT, '900 ' + CF + 'px Fraunces') + 64, ch = 128;
  s += '<g transform="translate(' + CX + ' ' + CY + ') rotate(-6)">';
  s += '<rect x="' + f1(-cw / 2 - 30) + '" y="' + f1(-ch / 2 - 30) + '" width="' + f1(cw + 60) + '" height="' + f1(ch + 60) + '" rx="40" fill="' + YEL + '" opacity=".85" filter="url(#glow)"/>';
  s += '<rect x="' + f1(-cw / 2 + 10) + '" y="' + f1(-ch / 2 + 14) + '" width="' + f1(cw) + '" height="' + ch + '" rx="16" fill="#000" opacity=".5"/>';
  var cardP = S.rect(-cw / 2, -ch / 2, cw, ch, 30, 1.3);
  s += S.shape(cardP, PAPER, { w: 5, extra: 3 });
  s += brush([[-cw / 2 + 24, -ch / 2 + 26], [cw / 2 - 24, -ch / 2 + 24]], 3, '#c43d33');
  s += '<text x="0" y="' + f1(CF * 0.38) + '" font-family="Fraunces" font-weight="900" font-size="' + CF + '" text-anchor="middle" fill="' + INK + '">' + CT + '</text>';
  s += '</g>';
  s += tag(CX + 116, CY - 96, 'ABRUFEN ✓', GREEN, '#fff', 34, 6, 2);
  [[CX - 250, CY - 60, 16], [CX + 250, CY + 40, 14], [CX - 210, CY + 70, 10]].forEach(function (p) { s += star(p[0], p[1], p[2] * 2, YEL, 0.35) + star(p[0], p[1], p[2], '#fff6d6', 1); });

  // ── Melo climbing (feet on rung 2, gripping rung 3, reaching up to the card) ──
  var HH = 170, MX = lx(1310) + GAPR / 2 + 2, MY = 1310 - 388 / 196 * HH - 8;
  var pz = JSON.parse(JSON.stringify(MeloB._POSES.point));
  var u = 196 / HH, gy = (968 - MY) * u - 388;                     // rung 3 height in Melo units
  pz.a = { sh: [-14, -270], el: [-46, -318], wr: [-58, -368], hand: { g: 'fist', ang: -100, flip: 0 } };
  pz.b = { sh: [13, -272], el: [46, -318], wr: [62, -370], hand: { g: 'point', ang: -72, flip: 0 } };
  pz.la = { hip: [-6, -168], kn: [-26, -92], an: [-22, -14], foot: -1 };
  pz.lb = { hip: [6, -168], kn: [22, -90], an: [26, -14], foot: 1 };
  pz.tilt = 3;
  s += melo({ view: 'full', poseParams: pz, expression: 'surprised', look: [0.25, -0.75], headTilt: 6 }, MX, MY, HH);

  // ── flashcard pile on the ground (bottom, decoration) ──
  [[150, 1640, -14, '#efe4c8'], [250, 1662, 9, '#e6dab8'], [190, 1690, -3, PAPER], [330, 1700, 16, '#e9ddbd']].forEach(function (c) {
    s += '<g transform="translate(' + c[0] + ' ' + c[1] + ') rotate(' + c[2] + ')">' + S.shape(S.rect(-80, -40, 160, 80, 30, 1), c[3], { w: 4, extra: 2 }) +
      brush([[-56, -10], [44, -12]], 4, '#8a7e9e') + brush([[-56, 12], [20, 10]], 4, '#8a7e9e') + '</g>';
  });

  s += '<rect width="1080" height="1920" fill="url(#vig)"/><rect width="1080" height="1920" filter="url(#grain)" opacity=".2" style="mix-blend-mode:overlay"/>';
  if (HASH === 'g') s += '<rect x="0" y="420" width="1080" height="1080" fill="none" stroke="#0f0" stroke-width="4" stroke-dasharray="20 12"/><rect x="0" y="1500" width="1080" height="420" fill="#f00" opacity=".18"/><rect x="0" y="0" width="1080" height="180" fill="#f00" opacity=".18"/>';
  document.getElementById('stage').innerHTML = '<defs>' + defs + S.defs + '</defs>' + s;
})();
</script>
</body>
</html>

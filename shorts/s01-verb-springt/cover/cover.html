<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cover Short s01 v2</title>
<!-- Shorts cover v2 for s01-verb-springt („weil ich bin müde“ ✗ → „weil ich müde BIN“ ✓, loop Short).
     Owner's favourite layout family (ep2 thumb B): diagonal split, huge Anton headline, red ink circle.
     Distinct from Shorts 1–3: the Short's own visual language = word cards. Dark espresso top half with the WRONG
     strip (struck through, big red ✗), cream paper bottom half with the RIGHT strip, the red verb card glowing at the end;
     a yellow brush arrow shows the verb jumping to the end. Tired Melo with his coffee bottom right.
     Key content inside the central 1080×1080 (y 420–1500). Append #g to overlay the safe zones.
     node tools/render.js shorts/s01-verb-springt/cover/cover.html shorts/s01-verb-springt/out/cover-v2.png 1080 1920 -->
<style>
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../../brand/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-ext-900-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1c120c; }
  svg { display: block; }
</style>
<script src="../../../brand/concepts/b/melo-b.js"></script>
<script src="../../../brand/channel/scene-ink.js"></script>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
(async function () {
  await Promise.all(['400 100px Anton', '700 100px Oswald', '900 100px Fraunces'].map(function (f) { return document.fonts.load(f, 'AÖẞ„“!?–müde'); }));
  var W = 1080, H = 1920, HASH = (location.hash || '').slice(1);
  var INK = '#14110d', RED = '#E5302A', CRED = '#c43d33', YEL = '#FFC83A', GREEN = '#2f9a3e', PAPER = '#f4ead2', CREAM = '#f3ead3';
  var S = new SceneInk(41), U = MeloB._util;
  var defs = '', s = '';
  var cv = document.createElement('canvas').getContext('2d');
  function measure(t, font) { cv.font = font; return cv.measureText(t).width; }
  function f1(v) { return U.f1(v); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  defs += '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="6"/>' +
    '<feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 -1.6 .8"/></filter>' +
    '<filter id="soft" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>' +
    '<filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>' +
    '<filter id="sil" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>' +
    '<feFlood flood-color="#000"/><feComposite in2="d" operator="in"/></filter>' +
    '<radialGradient id="rays" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#6b3b1c"/><stop offset=".55" stop-color="#3a2214"/><stop offset="1" stop-color="#170e09"/></radialGradient>' +
    '<radialGradient id="paperG" cx="55%" cy="70%" r="75%"><stop offset="0" stop-color="#f6ecd2"/><stop offset="1" stop-color="#ddcaa2"/></radialGradient>' +
    '<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>';

  // Anton word with heavy outline + offset shadow
  function word(t, x, y, size, fill, o) {
    o = o || {};
    var sw = size * 0.08, sh = size * 0.06;
    var a = 'x="' + x + '" y="' + y + '" font-family="Anton" font-size="' + size + '" text-anchor="' + (o.anchor || 'middle') + '"' + (o.ls ? ' letter-spacing="' + o.ls + '"' : '');
    var g = '<g' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : '') + '>';
    g += '<text ' + a + ' fill="#000" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" transform="translate(' + f1(sh) + ' ' + f1(sh * 1.2) + ')">' + esc(t) + '</text>';
    g += '<text ' + a + ' fill="' + fill + '" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" paint-order="stroke fill">' + esc(t) + '</text>';
    return g + '</g>';
  }
  // word card (same language as the video: Fraunces 900, ink outline, offset shadow); returns {svg, w}
  function cardW(t, fs) { return measure(t, '900 ' + fs + 'px Fraunces') + fs * 0.6; }
  function card(t, cx, cy, fs, kind, rot) {
    var w = cardW(t, fs), h = fs * 1.34, x = -w / 2, y = -h / 2;
    var fill = kind === 'verb' ? CRED : kind === 'conn' ? CRED : PAPER, tc = kind === 'verb' || kind === 'conn' ? CREAM : INK;
    var g = '<g transform="translate(' + f1(cx) + ' ' + f1(cy) + ') rotate(' + (rot || 0) + ')">';
    if (kind === 'verb' && /glow/.test(arguments[6] || '')) g += '<rect x="' + f1(x - 18) + '" y="' + f1(y - 18) + '" width="' + f1(w + 36) + '" height="' + f1(h + 36) + '" rx="40" fill="' + YEL + '" opacity=".95" filter="url(#glow)"/>';
    g += '<rect x="' + f1(x + 8) + '" y="' + f1(y + 12) + '" width="' + f1(w) + '" height="' + f1(h) + '" rx="' + f1(h * 0.2) + '" fill="#000" opacity=".55"/>';
    g += S.shape(S.rect(x, y, w, h, 30, 1.4), fill, { w: 5, extra: 3 });
    g += '<text x="0" y="' + f1(fs * 0.34) + '" font-family="Fraunces" font-weight="900" font-size="' + fs + '" text-anchor="middle" fill="' + tc + '">' + esc(t) + '</text>';
    return { svg: g + '</g>', w: w };
  }
  function strip(words, cx, cy, fs, kinds, rots, glow, maxW) {
    var tot0 = words.reduce(function (a, t) { return a + cardW(t, fs); }, 0) + fs * 0.2 * (words.length - 1);
    if (maxW && tot0 > maxW) fs = Math.floor(fs * maxW / tot0);
    var gap = fs * 0.2, ws = words.map(function (t) { return cardW(t, fs); }), tot = ws.reduce(function (a, b) { return a + b; }, 0) + gap * (words.length - 1);
    var x = cx - tot / 2, out = '', pos = [];
    words.forEach(function (t, i) {
      var c = card(t, x + ws[i] / 2, cy, fs, kinds[i], rots[i], glow);
      out += c.svg; pos.push([x + ws[i] / 2, ws[i]]); x += ws[i] + gap;
    });
    return { svg: out, pos: pos, x0: cx - tot / 2, x1: cx + tot / 2 };
  }
  function brush(pts, w, color, smooth) { return S.line(pts, { w: w, ta: 0.12, tb: 0.25, min: 0.45, jit: 0.2, smooth: smooth || 0 }, color); }
  function arrow(pts, w, color) {
    var a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = w * 3.2;
    var h1 = [b[0] - L * Math.cos(ang - 0.6), b[1] - L * Math.sin(ang - 0.6)], h2 = [b[0] - L * Math.cos(ang + 0.6), b[1] - L * Math.sin(ang + 0.6)];
    return S.line(pts, { w: w, ta: 0.1, tb: 0.02, min: 0.7, jit: 0.1, smooth: 8 }, color) +
      S.line([h1, b], { w: w, ta: 0.2, tb: 0.05, min: 0.7 }, color) + S.line([h2, b], { w: w, ta: 0.2, tb: 0.05, min: 0.7 }, color);
  }
  function melo(opts, hx, hy, hh) {
    var m = MeloB.svg(Object.assign({ seed: 11 }, opts));
    var u = 196 / hh, cx = 0, cy = -388;
    var vb = [cx - hx * u, cy - hy * u, W * u, H * u].map(function (v) { return Math.round(v * 100) / 100; }).join(' ');
    m = m.replace(/viewBox="[^"]*"/, 'viewBox="' + vb + '" x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none"').replace(/ width="\d+" height="\d+"(?= class)/, '');
    return '<g filter="url(#sil)">' + m + '</g>' + m;
  }

  // ── background: diagonal split (dark espresso top / cream paper bottom)
  var SPLIT = [[-20, 1175], [1100, 905]];
  s += '<rect width="1080" height="1920" fill="url(#rays)"/>';
  for (var k = 0; k < 18; k++) { var a0 = -Math.PI / 2 + (k - 9) * 0.19; s += '<path d="M540 640 L' + f1(540 + 1600 * Math.cos(a0 - 0.045)) + ' ' + f1(640 + 1600 * Math.sin(a0 - 0.045)) + ' L' + f1(540 + 1600 * Math.cos(a0 + 0.045)) + ' ' + f1(640 + 1600 * Math.sin(a0 + 0.045)) + 'Z" fill="#8a4e22" opacity=".18"/>'; }
  s += '<path d="M-20 ' + SPLIT[0][1] + ' L1100 ' + SPLIT[1][1] + ' L1100 1940 L-20 1940Z" fill="url(#paperG)"/>';
  s += S.hatch(S.poly([[0, 1180], [1080, 920], [1080, 1920], [0, 1920]], 80, 0), { ang: 35, gap: 14, w: 1.3, op: 0.09 });
  s += brush([[-20, SPLIT[0][1] + 4], [540, 1040 + 4], [1100, SPLIT[1][1] + 4]], 16, INK);

  // ── headline
  s += '<g transform="translate(70 120) rotate(-3)">' + S.shape(S.rect(0, 0, 150, 62, 30, 1.2), YEL, { w: 3.5, extra: 2 }) +
    '<text x="75" y="46" font-family="Oswald" font-weight="700" font-size="38" text-anchor="middle" fill="' + INK + '">B1–C1</text></g>';
  s += word('FEHLER', 540, 405, 190, '#ffffff', { rot: -3 });
  s += word('NR. 1', 540, 610, 210, YEL, { rot: -3 });
  // red ink circle around NR. 1
  var cpts = []; for (var i = 0; i <= 44; i++) { var an = -2.9 + i / 44 * 6.75; cpts.push([540 + 285 * Math.cos(an) + (i > 38 ? 14 : 0), 535 + 128 * Math.sin(an) - (i > 38 ? 10 : 0)]); }
  s += '<g transform="rotate(-4 540 535)">' + S.line(cpts, { w: 15, ta: 0.05, tb: 0.35, min: 0.4, jit: 0.25, smooth: 4 }, RED) + '</g>';

  // ── WRONG strip
  var fs = 92;
  var wr = strip(['weil', 'ich', 'bin', 'müde'], 490, 790, fs, ['conn', 'plain', 'verb', 'plain'], [-3, 2, -2, 3], '', 780);
  s += wr.svg;
  s += brush([[wr.x0 - 20, 806], [wr.x1 + 10, 772]], 17, RED);
  var xx = wr.x1 + 52, yy = 770;
  if (xx > 990) xx = 990;
  s += brush([[xx - 62, yy - 70], [xx + 58, yy + 68]], 30, RED) + brush([[xx + 60, yy - 72], [xx - 58, yy + 66]], 30, RED);
  s += '<g transform="translate(' + f1(wr.x0 - 10) + ' 668) rotate(-5)">' + S.shape(S.rect(0, 0, 176, 54, 30, 1.2), RED, { w: 3, extra: 2 }) +
    '<text x="88" y="41" font-family="Oswald" font-weight="700" font-size="34" letter-spacing="3" text-anchor="middle" fill="#fff">FALSCH</text></g>';

  // ── RIGHT strip (verb card glowing at the end)
  var rt = strip(['weil', 'ich', 'müde', 'BIN'], 480, 1205, 100, ['conn', 'plain', 'plain', 'verb'], [-2, 2, -2, 3], 'glow', 820);
  s += rt.svg;
  var tkx = rt.x1 + 30, tky = 1215;
  s += brush([[tkx, tky - 20], [tkx + 30, tky + 22], [tkx + 92, tky - 72]], 22, GREEN, 4);
  s += '<g transform="translate(' + f1(rt.x0 - 6) + ' 1078) rotate(-4)">' + S.shape(S.rect(0, 0, 176, 54, 30, 1.2), GREEN, { w: 3, extra: 2 }) +
    '<text x="88" y="41" font-family="Oswald" font-weight="700" font-size="34" letter-spacing="3" text-anchor="middle" fill="#fff">RICHTIG</text></g>';

  // ── the jump: yellow brush arrow from the wrong verb position to the end of the right strip
  var vb = wr.pos[2], ve = rt.pos[3];
  s += arrow([[vb[0], 862], [vb[0] + 60, 960], [ve[0] - 70, 1000], [ve[0] - 6, 1112]], 14, INK);
  s += arrow([[vb[0], 856], [vb[0] + 60, 952], [ve[0] - 70, 992], [ve[0] - 6, 1104]], 9, YEL);
  s += '<text x="' + f1(vb[0] + 150) + '" y="938" font-family="Oswald" font-weight="700" font-size="40" fill="' + YEL + '" transform="rotate(-8 ' + f1(vb[0] + 150) + ' 938)">VERB → ENDE</text>';

  // ── question
  s += word('Wo steht das Verb?', 540, 1440, 104, INK === '#000' ? '#fff' : '#ffffff', { rot: -2 });

  // ── tired Melo with his coffee (bottom right, small)
  s += melo({ view: 'full', pose: 'idle', expression: 'unimpressed', look: [-0.6, 0.1], headTilt: -6 }, 880, 1610, 175);
  var mx = 700, my = 1790;
  s += '<g transform="translate(' + mx + ' ' + my + ') rotate(-4)">' +
    brush([[-8, -95], [6, -125], [-6, -155]], 7, '#9a8d78', 6) + brush([[22, -95], [36, -128], [24, -160]], 7, '#9a8d78', 6) +
    S.shape(S.ellipse(8, 26, 110, 20, 28, 0.6), '#e9dcbc', { w: 5 }) +
    S.line([[58, -58], [98, -52], [96, -8], [54, -2]], { w: 9, ta: 0.1, tb: 0.1, min: 0.8 }, INK) +
    S.shape(S.poly([[-48, -84], [64, -84], [56, 18], [-40, 18]], 20, 1.2), '#f4ead2', { w: 5, extra: 2 }) +
    '<ellipse cx="8" cy="-82" rx="54" ry="11" fill="#5a3418" stroke="' + INK + '" stroke-width="4"/>' + '</g>';

  s += '<rect width="1080" height="1920" fill="url(#vig)"/><rect width="1080" height="1920" filter="url(#grain)" opacity=".2" style="mix-blend-mode:overlay"/>';
  if (HASH === 'g') s += '<rect x="0" y="420" width="1080" height="1080" fill="none" stroke="#0f0" stroke-width="4" stroke-dasharray="20 12"/><rect x="0" y="1500" width="1080" height="420" fill="#f00" opacity=".18"/>';
  document.getElementById('stage').innerHTML = '<defs>' + defs + S.defs + '</defs>' + s;
})();
</script>
</body>
</html>

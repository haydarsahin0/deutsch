<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cover Short 05 v2</title>
<!-- Shorts cover v2 for 05-doch („Hast du keinen Hunger?“ – „Ja!“ → she orders ONE pizza, for herself. Contradict a nicht/kein question with „Doch!“).
     Own colour world: Italian pizzeria — dark brick oven wall with an orange fire glow (wrong side) / basil green (right side),
     split by a diagonal cream band (= the Italian tricolore read diagonally); red-white awning on top, red gingham table at the bottom.
     Own layout: hook line on top; upper wedge = strawberry flatmate happily holding the single open pizza box + her question bubble +
     Melo's wrong answer „JA!“ scratched out; lower wedge = giant yellow „DOCH!“ in a red ink circle, hungry Melo pointing at the pizza;
     rule chip „nicht / kein? → DOCH!“; bottom decoration = Melo's empty plate.
     Key content in the central 1080×1080 (y 420–1500). Append #g to overlay the safe zones.
     node tools/render.js shorts/05-doch/cover/cover.html shorts/05-doch/out/cover-v2.png 1080 1920 -->
<style>
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../../brand/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; src: url('../../../brand/fonts/fraunces-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 900; font-style: italic; src: url('../../../brand/fonts/fraunces-latin-900-italic.woff2') format('woff2'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2a120c; }
  svg { display: block; }
</style>
<script src="../../../brand/concepts/b/melo-b.js"></script>
<script src="../../../brand/channel/scene-ink.js"></script>
<script src="../../../engine/cast/cast.js"></script>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
(async function () {
  await Promise.all(['400 100px Anton', '700 100px Oswald', '900 100px Fraunces', 'italic 900 100px Fraunces'].map(function (f) { return document.fonts.load(f, 'AÖ„“!?…–→Hunger'); }));
  var W = 1080, H = 1920, HASH = (location.hash || '').slice(1);
  var INK = '#14110d', RED = '#d8322a', DRED = '#8e1b16', YEL = '#FFC83A', CREAM = '#f4ead2', BASIL = '#2f7a43', DBASIL = '#17482a';
  var S = new SceneInk(505), U = MeloB._util;
  var defs = '', s = '';
  var cv = document.createElement('canvas').getContext('2d');
  function measure(t, font) { cv.font = font; return cv.measureText(t).width; }
  function f1(v) { return U.f1(v); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function R(a, b) { return S.rand(a, b); }

  defs += '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/>' +
    '<feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 -1.6 .8"/></filter>' +
    '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>' +
    '<filter id="sil" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>' +
    '<feFlood flood-color="#000"/><feComposite in2="d" operator="in"/></filter>' +
    '<filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dx="9" dy="13"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer></filter>' +
    '<radialGradient id="oven" cx="28%" cy="38%" r="70%"><stop offset="0" stop-color="#8a3a17"/><stop offset=".45" stop-color="#4a1a0e"/><stop offset="1" stop-color="#1e0b07"/></radialGradient>' +
    '<radialGradient id="basil" cx="40%" cy="62%" r="70%"><stop offset="0" stop-color="#3f9655"/><stop offset=".6" stop-color="' + BASIL + '"/><stop offset="1" stop-color="' + DBASIL + '"/></radialGradient>' +
    '<radialGradient id="vig" cx="50%" cy="48%" r="75%"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>';

  function word(t, x, y, size, fill, o) {
    o = o || {};
    var sw = size * 0.075, sh = size * 0.06;
    var a = 'x="' + x + '" y="' + y + '" font-family="Anton" font-size="' + size + '" text-anchor="' + (o.anchor || 'middle') + '"' + (o.ls ? ' letter-spacing="' + o.ls + '"' : '');
    var g = '<g' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : '') + '>';
    g += '<text ' + a + ' fill="#000" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" transform="translate(' + f1(sh) + ' ' + f1(sh * 1.2) + ')">' + esc(t) + '</text>';
    g += '<text ' + a + ' fill="' + fill + '" stroke="#000" stroke-width="' + f1(sw * 2) + '" stroke-linejoin="round" paint-order="stroke fill">' + esc(t) + '</text>';
    return g + '</g>';
  }
  function brush(pts, w, color, smooth, extra) { return S.line(pts, { w: w, ta: 0.12, tb: 0.25, min: 0.45, jit: 0.2, smooth: smooth || 0 }, color, extra); }
  function tag(x, y, t, bg, fg, size, rot, ls, font) {
    font = font || 'Oswald';
    var w = measure(t, '700 ' + size + 'px ' + font) + size * 0.9 + (ls || 0) * t.length, h = size * 1.42;
    return '<g transform="translate(' + f1(x) + ' ' + f1(y) + ') rotate(' + (rot || 0) + ')">' + S.shape(S.rect(-w / 2, -h / 2, w, h, 30, 1.2), bg, { w: 3.5, extra: 2 }) +
      '<text x="0" y="' + f1(size * 0.36) + '" font-family="' + font + '" font-weight="700" font-size="' + size + '"' + (ls ? ' letter-spacing="' + ls + '"' : '') + ' text-anchor="middle" fill="' + fg + '">' + esc(t) + '</text></g>';
  }
  function melo(opts, hx, hy, hh, flip) {
    var m = MeloB.svg(Object.assign({ seed: 11 }, opts));
    var u = 196 / hh;
    var vb = [-hx * u, -388 - hy * u, W * u, H * u].map(function (v) { return Math.round(v * 100) / 100; }).join(' ');
    m = m.replace(/viewBox="[^"]*"/, 'viewBox="' + vb + '" x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none"').replace(/ width="\d+" height="\d+"(?= class)/, '');
    var g = '<g filter="url(#drop)">' + m + '</g><g filter="url(#sil)">' + m + '</g>' + m;
    return flip ? '<g transform="translate(' + (2 * hx) + ' 0) scale(-1 1)">' + g + '</g>' : g;
  }
  function cast(id, o, x, y, r) {
    var f0 = Cast.render(id, Object.assign({ t: 0, seed: 3, scale: 1 }, o));
    var k = r / (f0.anchors.headCenter[1] - f0.anchors.headTop[1]);
    var fr = Cast.render(id, Object.assign({ t: 0, seed: 3, scale: k }, o)), hc = fr.anchors.headCenter;
    var dx = x - hc[0], dy = y - hc[1];
    var g = '<g transform="translate(' + f1(dx) + ' ' + f1(dy) + ')">' + fr.svg + '</g>';
    return { svg: '<g filter="url(#drop)">' + g + '</g><g filter="url(#sil)">' + g + '</g>' + g, a: fr.anchors, dx: dx, dy: dy };
  }

  // ── diagonal split geometry: cream band from (0, Y0) to (1080, Y1) ──
  var Y0 = 1010, Y1 = 812, BW = 46;
  function diagY(x) { return Y0 + (Y1 - Y0) * x / W; }

  // ── upper wedge: dark brick pizza-oven wall with fire glow ──
  var up = [[-20, -20], [1100, -20], [1100, diagY(1100)], [-20, diagY(-20)]];
  s += S.fillOnly(up, 'url(#oven)');
  s += '<ellipse cx="300" cy="640" rx="360" ry="300" fill="#ff7a1e" opacity=".33" filter="url(#glow)"/>';
  var bricks = [];
  for (var row = 0, by = 196; by < 1020; by += 58, row++) {
    bricks.push([[-20, by + R(-2, 2)], [1100, by + R(-2, 2)]]);
    for (var bx = (row % 2 ? -60 : 0); bx < 1100; bx += 120) bricks.push([[bx + R(-3, 3), by], [bx + R(-3, 3), by + 58]]);
  }
  s += '<g clip-path="url(#upClip)">' + S.lines(bricks, { w: 4, ta: 0.05, tb: 0.05, min: 0.6, jit: 0.4 }, '#120604', ' opacity=".55"') + '</g>';
  defs += '<clipPath id="upClip"><path d="' + U.polyD(up, true) + '"/></clipPath>';
  s += '<g clip-path="url(#upClip)">' + S.hatch(S.rect(0, 180, 1080, 860, 200, 0), { ang: -32, gap: 13, w: 1.2, op: 0.16 }) + '</g>';
  // a few lighter bricks catching the fire light
  [[180, 486], [420, 370], [60, 776], [300, 834], [660, 312], [900, 486], [780, 660]].forEach(function (b) {
    s += S.fillOnly(S.rect(b[0] + 6, b[1] + 6, 108, 46, 30, 1.2), '#c0582a', ' opacity=".22"');
  });

  // ── lower wedge: basil green ──
  var lo = [[-20, diagY(-20)], [1100, diagY(1100)], [1100, 1940], [-20, 1940]];
  s += S.fillOnly(lo, 'url(#basil)');
  defs += '<clipPath id="loClip"><path d="' + U.polyD(lo, true) + '"/></clipPath>';
  s += '<g clip-path="url(#loClip)">' + S.hatch(S.rect(0, 780, 1080, 760, 200, 0), { ang: 34, gap: 12, w: 1.3, color: '#0c2a17', op: 0.35 }) + '</g>';
  // sun-burst rays behind DOCH
  for (var i = 0; i < 16; i++) {
    var a0 = i / 16 * Math.PI * 2, a1 = a0 + 0.12;
    s += '<path clip-path="url(#loClip)" d="M410 1170 L' + f1(410 + 1200 * Math.cos(a0)) + ' ' + f1(1170 + 1200 * Math.sin(a0)) + ' L' + f1(410 + 1200 * Math.cos(a1)) + ' ' + f1(1170 + 1200 * Math.sin(a1)) + 'Z" fill="#9ee09a" opacity=".09"/>';
  }

  // ── the cream diagonal band (tricolore), inked edges ──
  var band = [[-20, diagY(-20) - BW / 2], [1100, diagY(1100) - BW / 2], [1100, diagY(1100) + BW / 2], [-20, diagY(-20) + BW / 2]];
  s += '<g filter="url(#drop)">' + S.fillOnly(band, CREAM) + '</g>' + S.shape(S.poly(band, 40, 1.5), CREAM, { w: 6, extra: 2 });
  s += S.hatch(band, { ang: 70, gap: 10, w: 1.1, op: 0.18 });

  // ── top decoration: pizzeria awning (red / cream stripes, scalloped) + B1–C1 ──
  var aw = '';
  for (var k = 0; k < 9; k++) {
    var x0 = -30 + k * 128, col = k % 2 ? CREAM : RED;
    var stripe = [[x0, -20], [x0 + 128, -20], [x0 + 128, 128]].concat(S.ellipse(x0 + 64, 128, 64, 40, 18, 0.01, 0, Math.PI)).concat([[x0, 128]]);
    aw += S.shape(stripe, col, { w: 4.5, extra: 2 });
    if (k % 2 === 0) aw += S.hatch(stripe, { ang: 80, gap: 9, w: 1.1, color: DRED, op: 0.5 });
  }
  aw += S.shape(S.rect(-20, -20, 1120, 34, 40, 1), '#2b6b3b', { w: 4, extra: 1 });
  s += '<g filter="url(#drop)">' + aw + '</g>' + aw;
  s += '<g transform="translate(870 60) rotate(3)">' + S.shape(S.rect(0, 0, 150, 62, 30, 1.2), YEL, { w: 3.5, extra: 2 }) +
    '<text x="75" y="46" font-family="Oswald" font-weight="700" font-size="38" text-anchor="middle" fill="' + INK + '">B1–C1</text></g>';

  // ── hook line ─────────────────────────────────────────
  s += word('SOGAR C1 STOLPERT!', 540, 330, 124, '#ffffff', { rot: -2 });
  // yellow underline brush under „C1“ region
  s += brush([[300, 362], [430, 356], [520, 360]], 11, YEL, 0, '');

  // ── upper scene: strawberry flatmate with the ONE pizza ─
  var fm = cast('mitbewohnerin', { expr: 'happy', pose: 'hold', prop: 'none', look: [0.6, 0] }, 150, 556, 84);
  s += fm.svg;
  // open pizza box held in front of her (held at her raised hand)
  var hx = fm.dx + fm.a.handR[0], hy = fm.dy + fm.a.handR[1];
  var BWd = 250, BX = hx + BWd / 2 - 6, BY = hy + 20;
  var box = '<g transform="translate(' + f1(BX) + ' ' + f1(BY) + ') rotate(-6)">';
  var lid = [[-BWd / 2 + 18, -70], [BWd / 2 - 18, -70], [BWd / 2 - 36, -250], [-BWd / 2 + 36, -250]];
  box += S.shape(S.poly(lid, 30, 1.5), '#e9d2a2', { w: 5, extra: 2 }) + S.hatch(lid, { ang: 15, gap: 10, w: 1.1, color: '#8a6a3a', op: 0.5 });
  // lid print: little red chef-hat stamp + „PIZZA“
  box += '<text x="0" y="-150" font-family="Fraunces" font-weight="900" font-style="italic" font-size="44" text-anchor="middle" fill="' + RED + '" transform="rotate(0)">Pizza</text>';
  box += brush([[-56, -120], [56, -122]], 5, RED);
  box += S.shape(S.ellipse(0, -205, 22, 15, 16, 0.04), '#ffffff', { w: 3.5, extra: 1 });
  // base: inside face (trapezoid) + front wall
  var inner = [[-BWd / 2, 30], [BWd / 2, 30], [BWd / 2 - 22, -70], [-BWd / 2 + 22, -70]];
  box += S.shape(S.poly(inner, 30, 1.2), '#d9bb84', { w: 5, extra: 2 });
  var front = [[-BWd / 2, 30], [BWd / 2, 30], [BWd / 2 - 4, 66], [-BWd / 2 + 4, 66]];
  box += S.shape(S.poly(front, 30, 1.2), '#caa46a', { w: 5, extra: 2 }) + S.hatch(front, { ang: -20, gap: 8, w: 1.1, color: '#6b4a22', op: 0.6 });
  // the pizza
  box += S.shape(S.ellipse(0, -20, 122, 44, 40, 0.02), '#d98b3a', { w: 5, extra: 2 });
  box += S.shape(S.ellipse(0, -20, 104, 35, 40, 0.03), '#e04a2a', { w: 3, extra: 1 });
  [[-60, -26, 22, 9], [10, -38, 26, 9], [52, -10, 22, 8], [-20, -2, 24, 8], [70, -32, 16, 6]].forEach(function (c) { box += S.fillOnly(S.ellipse(c[0], c[1], c[2], c[3], 16, 0.12), '#ffd36b'); });
  [[-40, -34], [30, -18], [-70, -8], [74, -16], [0, -46], [-6, -14]].forEach(function (c) { box += S.shape(S.ellipse(c[0], c[1], 12, 6, 14, 0.04), '#a52a1c', { w: 2.2, extra: 0 }); });
  [[-22, -28, 30], [46, -36, -20], [56, -2, 60]].forEach(function (c) { box += '<g transform="translate(' + c[0] + ' ' + c[1] + ') rotate(' + c[2] + ')">' + S.shape(S.ellipse(0, 0, 11, 5, 12, 0.03), '#2f7a2c', { w: 2, extra: 0 }) + '</g>'; });
  box += '</g>';
  // steam
  var st = '';
  [[BX - 60, BY - 70], [BX + 10, BY - 84], [BX + 80, BY - 74]].forEach(function (p, i) {
    st += brush([[p[0], p[1]], [p[0] - 14, p[1] - 40], [p[0] + 10, p[1] - 80], [p[0] - 8, p[1] - 120]], 7, '#ffe9c8', 4, ' opacity=".75"');
  });
  s += '<g filter="url(#drop)">' + box + '</g>' + box + st;
  // her hand in front of the box bottom: tiny strawberry-red fingers
  s += S.shape(S.ellipse(hx + 6, BY + 50, 20, 14, 14, 0.05), '#c4473c', { w: 4, extra: 1 });
  // „1×“ ink tag on the box — only ONE pizza
  s += tag(BX + 40, BY + 110, 'NUR 1 PIZZA', YEL, INK, 34, -6, 1);

  // question bubble (from her)
  var QX = 800, QY = 450, qw = 480, qh = 176;
  var bub = S.poly([[QX - qw / 2, QY - qh / 2], [QX + qw / 2, QY - qh / 2 - 8], [QX + qw / 2 + 6, QY + qh / 2], [QX - qw / 2 + 120, QY + qh / 2 + 4], [QX - qw / 2 + 40, QY + qh / 2 + 70], [QX - qw / 2 + 60, QY + qh / 2 + 2], [QX - qw / 2 - 4, QY + qh / 2]], 30, 1.5);
  s += '<g filter="url(#drop)">' + S.fillOnly(bub, CREAM) + '</g>' + S.shape(bub, CREAM, { w: 6, extra: 3 });
  s += '<text x="' + QX + '" y="' + (QY - 14) + '" font-family="Fraunces" font-weight="900" font-size="54" text-anchor="middle" fill="' + INK + '">„Hast du <tspan fill="' + RED + '">keinen</tspan></text>';
  s += '<text x="' + QX + '" y="' + (QY + 56) + '" font-family="Fraunces" font-weight="900" font-size="54" text-anchor="middle" fill="' + INK + '">Hunger?“</text>';

  // Melo's wrong answer „JA!“ — scratched out
  var JX = 790, JY = 760;
  s += word('„JA!“', JX, JY, 180, '#ffffff', { rot: 4 });
  s += S.line([[JX - 170, JY - 150], [JX + 160, JY - 10]], { w: 30, ta: 0.08, tb: 0.15, min: 0.5, jit: 0.3 }, '#000', ' transform="translate(5 7)" opacity=".5"');
  s += S.line([[JX - 170, JY - 150], [JX + 160, JY - 10]], { w: 26, ta: 0.08, tb: 0.15, min: 0.5, jit: 0.3 }, RED);
  s += S.line([[JX - 160, JY - 20], [JX + 170, JY - 140]], { w: 26, ta: 0.08, tb: 0.15, min: 0.5, jit: 0.3 }, RED);

  // ── lower wedge: giant „DOCH!“ + red ink circle ───────
  var DX = 400, DY = 1290, DS = 330;
  s += word('DOCH!', DX, DY, DS, YEL, { rot: -5 });
  var ring = S.ellipse(DX, DY - 140, 380, 205, 60, 0.03, -0.25, Math.PI * 2 + 0.25);
  s += S.line(ring, { w: 18, ta: 0.1, tb: 0.15, min: 0.4, jit: 0.4, smooth: 2 }, RED, ' transform="rotate(-6 ' + DX + ' ' + (DY - 140) + ')"');
  // green check disc
  s += '<g transform="translate(118 948)">' + S.shape(S.ellipse(0, 0, 54, 54, 30, 0.04), '#ffffff', { w: 5, extra: 2 }) + brush([[-26, 2], [-6, 24], [30, -26]], 15, '#2e9a46', 0) + '</g>';

  // hungry Melo (right), shouting & pointing up-left at the pizza
  s += melo({ view: 'full', pose: 'point', expression: 'talking', mouthOpen: 1, look: [0.8, -0.6], headTilt: 6 }, 930, 1146, 146, true);
  // drool + growl marks
  s += '<path d="M902 1222 q-6 22 0 34 q8 10 14 -2 q2 -14 -8 -32z" fill="#bfe8ff" stroke="' + INK + '" stroke-width="3"/>';
  s += brush([[1012, 1310], [1040, 1300]], 6, INK) + brush([[1016, 1334], [1050, 1330]], 6, INK) + brush([[1012, 1358], [1040, 1362]], 6, INK);

  // rule chip
  s += tag(400, 1420, 'nicht / kein?  →  DOCH!', CREAM, INK, 50, -2, 0);

  // ── bottom decoration: red gingham table + Melo's EMPTY plate ──
  var TY = 1560;
  var table = [[-20, TY + 6], [1100, TY - 6], [1100, 1940], [-20, 1940]];
  s += S.fillOnly(table, '#f5ece0');
  defs += '<clipPath id="tbClip"><path d="' + U.polyD(table, true) + '"/></clipPath>';
  var g2 = '';
  for (var c = -8; c < 18; c++) { var xa = 540 + (c - 5) * 90, xb = 540 + (c - 5) * 190; g2 += '<path d="M' + xa + ' ' + TY + ' L' + (xa + 45) + ' ' + TY + ' L' + (xb + 95) + ' 1940 L' + xb + ' 1940Z" fill="' + RED + '" opacity=".55"/>'; }
  for (var r2 = 0; r2 < 8; r2++) { var y1 = TY + Math.pow(r2 / 8, 1.5) * 380, y2 = TY + Math.pow((r2 + 0.5) / 8, 1.5) * 380; g2 += '<rect x="-20" y="' + f1(y1) + '" width="1120" height="' + f1(y2 - y1) + '" fill="' + RED + '" opacity=".5"/>'; }
  s += '<g clip-path="url(#tbClip)">' + g2 + S.hatch(S.rect(0, TY, 1080, 380, 200, 0), { ang: 20, gap: 12, w: 1.2, op: 0.2 }) + '</g>';
  s += brush([[-20, TY + 6], [1100, TY - 6]], 9, INK);
  // empty plate + fork & knife
  var PX = 640, PY = 1720;
  s += '<ellipse cx="' + (PX + 12) + '" cy="' + (PY + 16) + '" rx="230" ry="70" fill="#000" opacity=".3"/>';
  s += S.shape(S.ellipse(PX, PY, 230, 70, 50, 0.01), '#ffffff', { w: 5, extra: 2 }) + S.shape(S.ellipse(PX, PY - 4, 150, 42, 40, 0.02), '#f1efe8', { w: 3, extra: 1 });
  s += '<text x="' + PX + '" y="' + (PY + 10) + '" font-family="Fraunces" font-weight="900" font-style="italic" font-size="34" text-anchor="middle" fill="#9a9488">leer.</text>';
  [[PX - 296, -8], [PX + 300, 10]].forEach(function (u, i) {
    s += '<g transform="translate(' + u[0] + ' ' + PY + ') rotate(' + u[1] + ')">' + S.shape(S.rect(-10, -80, 20, 170, 20, 0.6), '#c9ccd0', { w: 4, extra: 1 }) +
      (i === 0 ? brush([[-8, -80], [-8, -120]], 5, INK) + brush([[0, -80], [0, -124]], 5, INK) + brush([[8, -80], [8, -120]], 5, INK) : S.shape(S.poly([[-10, -80], [12, -80], [10, -150], [-10, -110]], 20, 0.6), '#dfe2e6', { w: 4, extra: 1 })) + '</g>';
  });
  // crumbs + basil leaf
  [[250, 1640], [880, 1830], [180, 1860], [960, 1660]].forEach(function (p) { s += S.fillOnly(S.ellipse(p[0], p[1], 8, 5, 10, 0.2), '#d98b3a'); });
  s += '<g transform="translate(170 1700) rotate(-30)">' + S.shape(S.ellipse(0, 0, 46, 20, 20, 0.04), '#3f8a3a', { w: 4, extra: 1 }) + brush([[-40, 0], [40, 0]], 3, '#1d4a1c') + '</g>';

  s += '<rect width="1080" height="1920" fill="url(#vig)"/><rect width="1080" height="1920" filter="url(#grain)" opacity=".22" style="mix-blend-mode:multiply"/>';
  if (HASH === 'g') s += '<rect x="0" y="420" width="1080" height="1080" fill="none" stroke="#0f0" stroke-width="4" stroke-dasharray="20 12"/><rect x="0" y="1500" width="1080" height="420" fill="#f00" opacity=".18"/><rect x="0" y="0" width="1080" height="180" fill="#f00" opacity=".18"/>';
  document.getElementById('stage').innerHTML = '<defs>' + defs + S.defs + '</defs>' + s;
})();

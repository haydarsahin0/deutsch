<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Thumbnail Ep. 1</title>
<!-- Thumbnail for episode 1. Variant via hash: thumb.html#a | #b | #c
     node tools/render.js episodes/01-das-sagt-kein-deutscher/thumb/thumb.html#a out.png 1280 720 -->
<style>
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Anton'; src: url('../../../brand/fonts/anton-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../../brand/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Caveat'; font-weight: 700; src: url('../../../brand/fonts/caveat-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Kalam'; font-weight: 700; src: url('../../../brand/fonts/kalam-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b1020; }
  svg { display: block; }
</style>
<script src="../../../brand/concepts/b/melo-b.js"></script>
<script src="../../../brand/channel/scene-ink.js"></script>
</head>
<body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
(async function () {
  await Promise.all(['400 100px Anton', '700 100px Oswald', '700 100px Caveat', '700 100px Kalam'].map(function (f) { return document.fonts.load(f); }));
  var H = (location.hash || '#a').slice(1), V = H[0];
  var INK = '#14110d', RED = '#E5302A', YEL = '#FFC83A', GREEN = '#2FAE4E';
  var S = new SceneInk(V === 'a' ? 3 : V === 'b' ? 8 : 13), U = MeloB._util;
  var defs = '', s = '';
  var cv = document.createElement('canvas').getContext('2d');
  function measure(t, font) { cv.font = font; return cv.measureText(t).width; }

  defs += '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/>' +
    '<feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 -1.6 .8"/></filter>' +
    '<filter id="sil" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>' +
    '<feFlood flood-color="#000"/><feComposite in2="d" operator="in"/></filter>' +
    '<filter id="glowSh" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/><feGaussianBlur in="d" stdDeviation="16"/>' +
    '<feOffset dx="10" dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".75"/></feComponentTransfer></filter>' +
    '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="8" dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer></filter>';

  // ── helpers ──────────────────────────────────────────────
  function bg(glows, base) {
    var o = '<rect width="1280" height="720" fill="' + base + '"/>';
    glows.forEach(function (g, i) {
      defs += '<radialGradient id="gl' + i + '" cx="' + g.x + '" cy="' + g.y + '" r="' + g.r + '" gradientUnits="userSpaceOnUse">' +
        '<stop offset="0" stop-color="' + g.c + '" stop-opacity="' + (g.o || 1) + '"/><stop offset=".45" stop-color="' + g.c + '" stop-opacity="' + ((g.o || 1) * 0.45) + '"/><stop offset="1" stop-color="' + g.c + '" stop-opacity="0"/></radialGradient>';
      o += '<rect width="1280" height="720" fill="url(#gl' + i + ')"/>';
    });
    return o;
  }
  function rays(cx, cy, n, color, op) {
    var d = '';
    for (var i = 0; i < n; i++) {
      var a0 = i / n * Math.PI * 2, a1 = a0 + Math.PI / n * 0.9;
      d += 'M' + cx + ' ' + cy + 'L' + U.f1(cx + 1600 * Math.cos(a0)) + ' ' + U.f1(cy + 1600 * Math.sin(a0)) + 'L' + U.f1(cx + 1600 * Math.cos(a1)) + ' ' + U.f1(cy + 1600 * Math.sin(a1)) + 'Z';
    }
    return '<path d="' + d + '" fill="' + color + '" opacity="' + op + '"/>';
  }
  // big outlined poster word, fitted to width w (font size capped by maxSize). anchor: start|middle|end
  function word(t, x, y, w, maxSize, fill, o) {
    o = o || {};
    var font = o.font || 'Anton', weight = o.weight || 400;
    var size = Math.min(maxSize, maxSize * w / measure(t, weight + ' ' + maxSize + 'px ' + font));
    var sw = size * (o.sw || 0.075), sh = size * 0.055;
    var attrs = 'x="' + x + '" y="' + y + '" font-family="' + font + '" font-weight="' + weight + '" font-size="' + U.f1(size) + '" text-anchor="' + (o.anchor || 'start') + '" letter-spacing="' + (o.ls || 0) + '"';
    var esc = t.replace(/&/g, '&amp;');
    var g = '<g' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : '') + '>';
    g += '<text ' + attrs + ' fill="#000" stroke="#000" stroke-width="' + U.f1(sw * 2) + '" stroke-linejoin="round" transform="translate(' + U.f1(sh * 0.8) + ' ' + U.f1(sh) + ')">' + esc + '</text>';
    g += '<text ' + attrs + ' fill="' + fill + '" stroke="#000" stroke-width="' + U.f1(sw * 2) + '" stroke-linejoin="round" paint-order="stroke fill">' + esc + '</text>';
    return { svg: g + '</g>', size: size };
  }
  // Melo with a heavy black silhouette outline + soft shadow. hx,hy = skull centre on canvas, hh = skull height in px
  function melo(opts, hx, hy, hh) {
    var m = MeloB.svg(Object.assign({ seed: 11 }, opts));
    var u = 196 / hh, cx = 0, cy = -388;
    var vb = [cx - hx * u, cy - hy * u, 1280 * u, 720 * u].map(function (v) { return Math.round(v * 100) / 100; }).join(' ');
    m = m.replace(/viewBox="[^"]*"/, 'viewBox="' + vb + '" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"').replace(/ width="\d+" height="\d+"(?= class)/, '');
    return '<g filter="url(#glowSh)">' + m + '</g><g filter="url(#sil)">' + m + '</g>' + m;
  }
  function brushLine(pts, w, color, smooth) { return S.line(pts, { w: w, ta: 0.15, tb: 0.2, min: 0.5, jit: 0.15, smooth: smooth || 0 }, color); }
  // hand-drawn ink ellipse loop (slightly overshooting), for red circles
  function loop(cx, cy, rx, ry, w, color, rot) {
    var pts = [], n = 46, a0 = -2.2;
    for (var i = 0; i <= n; i++) {
      var a = a0 + (Math.PI * 2 + 0.55) * i / n, k = 1 + 0.05 * Math.sin(i * 0.5) + i * 0.0012;
      pts.push([cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)]);
    }
    return '<g transform="rotate(' + (rot || 0) + ' ' + cx + ' ' + cy + ')">' + S.line(pts, { w: w, ta: 0.08, tb: 0.25, min: 0.45, jit: 0.1 }, color) + '</g>';
  }
  function arrow(pts, w, color) {
    var a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = w * 3.6;
    var h1 = [b[0] - L * Math.cos(ang - 0.55), b[1] - L * Math.sin(ang - 0.55)], h2 = [b[0] - L * Math.cos(ang + 0.55), b[1] - L * Math.sin(ang + 0.55)];
    return S.line(pts, { w: w, ta: 0.1, tb: 0.02, min: 0.7, jit: 0.1, smooth: 8 }, color) +
      S.line([h1, b], { w: w, ta: 0.2, tb: 0.05, min: 0.7 }, color) + S.line([h2, b], { w: w, ta: 0.2, tb: 0.05, min: 0.7 }, color);
  }
  // paper card (rotated group), returns svg; content drawn in local coords (0,0)-(w,h)
  function card(x, y, w, h, rot, fill, inner) {
    var pts = S.rect(0, 0, w, h, 26, 2.2);
    return '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ')">' +
      '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#000" filter="url(#soft)"/>' +
      S.shape(pts, fill, { w: 4.5, extra: 3 }) +
      S.hatch(S.rect(0, 0, w, h, 60, 0), { ang: 45, gap: 9, w: 1.3, op: 0.12, cond: function (X, Y) { return X + Y > w + h * 0.55; } }) +
      inner + '</g>';
  }
  function badge(x, y, t, bgc, fg, size, rot) {
    var w = measure(t, '700 ' + size + 'px Oswald') + size * 0.8, h = size * 1.35;
    return '<g transform="translate(' + x + ' ' + y + ') rotate(' + (rot || 0) + ')">' +
      S.shape(S.rect(0, 0, w, h, 20, 1.2), bgc, { w: 3.5, extra: 2 }) +
      '<text x="' + (w / 2) + '" y="' + (h * 0.76) + '" font-family="Oswald" font-weight="700" font-size="' + size + '" fill="' + fg + '" text-anchor="middle">' + t + '</text></g>';
  }
  function stampX(cx, cy, r, color) {
    return '<g transform="translate(' + cx + ' ' + cy + ') rotate(-8)">' +
      S.line([[-r, -r], [-r * 0.1, -r * 0.08], [r, r]], { w: r * 0.36, ta: 0.08, tb: 0.15, min: 0.6, jit: 0.2 }, color) +
      S.line([[r * 0.95, -r * 1.02], [0, 0.05 * r], [-r * 0.98, r * 0.95]], { w: r * 0.36, ta: 0.08, tb: 0.15, min: 0.6, jit: 0.2 }, color) + '</g>';
  }
  function check(cx, cy, r, color) {
    return '<g transform="translate(' + cx + ' ' + cy + ')">' +
      S.line([[-r, -r * 0.05], [-r * 0.55, r * 0.35], [-r * 0.2, r * 0.75], [r * 0.25, r * 0.05], [r * 1.05, -r * 1.0]], { w: r * 0.38, ta: 0.15, tb: 0.1, min: 0.55, jit: 0.15, smooth: 6 }, color) + '</g>';
  }

  // ── variants ─────────────────────────────────────────────
  if (V === 'a') {
    // dark navy, orange glow behind Melo
    s += bg([{ x: 960, y: 330, r: 640, c: '#ff7a1a', o: 0.95 }, { x: 220, y: 600, r: 520, c: '#1f4bd1', o: 0.35 }], '#0a1026');
    s += rays(960, 330, 22, '#000', 0.13);
    // Melo, huge, right, side-eye at the card, raised "nope" finger
    s += melo({ view: 'full', pose: 'finger', expression: 'unimpressed', look: [-1, 0.25], headTilt: -6, pencil: true }, 950, 300, 370);
    // headline, stacked & tilted
    var t1 = word('DAS SAGT', 48, 178, 560, 190, '#ffffff', { rot: -4 });
    var t2 = word('KEINER!', 40, 370, 610, 260, YEL, { rot: -4 });
    s += t1.svg + t2.svg;
    // paper card with the crossed-out sentence
    var inner = '<text x="40" y="128" font-family="Caveat" font-weight="700" font-size="112" fill="' + INK + '">„Ich bin heiß.“</text>' +
      brushLine([[22, 92], [200, 86], [400, 80], [560, 70]], 20, RED);
    s += card(70, 430, 590, 190, -3, '#f4ecd8', inner);
    s += stampX(640, 455, 62, RED);
  }

  if (V === 'b') {
    // near-black with electric blue glow; Melo left, bubble right
    s += bg([{ x: 330, y: 330, r: 620, c: '#2f6bff', o: 0.95 }, { x: 1100, y: 120, r: 520, c: '#ff7a1a', o: 0.35 }], '#070b1c');
    s += rays(330, 330, 22, '#000', 0.14);
    s += melo({ view: 'full', pose: 'shrug', expression: 'surprised', look: [1, -0.1], headTilt: 6 }, 320, 300, 370);
    var w1 = word('VOLL', 1236, 168, 380, 210, '#ffffff', { anchor: 'end', rot: -4 });
    var w2 = word('PEINLICH!', 1240, 330, 640, 220, YEL, { anchor: 'end', rot: -4 });
    s += w1.svg + w2.svg;
    // speech bubble „Ich bin voll.“ (tail from off-screen bottom-left speaker → toward Melo side)
    var bx = 640, by = 410, bw = 560, bh = 190;
    var bub = S.rect(bx, by, bw, bh, 26, 2.4);
    var tail = [[bx + 90, by + bh - 4], [bx + 30, by + bh + 70], [bx + 170, by + bh - 4]];
    s += '<g filter="url(#soft)"><rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="40"/></g>';
    var rr = 40, bpath = 'M' + (bx + rr) + ' ' + by + 'H' + (bx + bw - rr) + 'Q' + (bx + bw) + ' ' + by + ' ' + (bx + bw) + ' ' + (by + rr) + 'V' + (by + bh - rr) + 'Q' + (bx + bw) + ' ' + (by + bh) + ' ' + (bx + bw - rr) + ' ' + (by + bh) +
      'H' + tail[2][0] + 'L' + tail[1][0] + ' ' + tail[1][1] + 'L' + tail[0][0] + ' ' + (by + bh) + 'H' + (bx + rr) + 'Q' + bx + ' ' + (by + bh) + ' ' + bx + ' ' + (by + bh - rr) + 'V' + (by + rr) + 'Q' + bx + ' ' + by + ' ' + (bx + rr) + ' ' + by + 'Z';
    s += '<path d="' + bpath + '" fill="#fbf6ea" stroke="#000" stroke-width="9" stroke-linejoin="round"/>';
    s += '<text x="' + (bx + 40) + '" y="' + (by + 132) + '" font-family="Caveat" font-weight="700" font-size="118" fill="' + INK + '">„Ich bin voll.“</text>';
    var vx = bx + 40 + measure('„Ich bin ', '700 118px Caveat'), vw = measure('voll', '700 118px Caveat');
    s += loop(vx + vw / 2, by + 98, vw / 2 + 30, 62, 11, RED, -6);
    s += arrow([[1210, 690], [1180, 640], [1120, 600]], 11, RED);
    s += badge(40, 34, 'B1–C1', YEL, INK, 46, -3);
  }

  if (V === 'c') {
    // split: wrong (red, left) / right (green, right), Melo in the seam
    s += '<rect width="1280" height="720" fill="#0c1a12"/>';
    s += '<path d="M0 0H700L580 720H0Z" fill="#5a0f0c"/>';
    s += bg([{ x: 250, y: 300, r: 520, c: '#e5302a', o: 0.55 }], 'none').replace('<rect width="1280" height="720" fill="none"/>', '');
    s += '<g>' + bg([{ x: 1030, y: 300, r: 520, c: '#2fae4e', o: 0.5 }], 'none').replace('<rect width="1280" height="720" fill="none"/>', '') + '</g>';
    s += '<path d="M0 0H700L580 720H0Z" fill="#e5302a" opacity=".18"/>';
    s += S.line([[702, -10], [640, 360], [578, 730]], { w: 12, ta: 0, tb: 0, min: 1 }, '#000');
    s += melo({ view: 'full', pose: 'point', expression: 'smirk', look: [1, -0.2], headTilt: 4 }, 640, 330, 340);
    var l1 = word('ICH BIN', 36, 150, 400, 170, '#ffffff', { rot: -3 });
    var l2 = word('HEISS', 36, 330, 400, 200, '#ffffff', { rot: -3 });
    var r1 = word('MIR IST', 1244, 150, 400, 170, '#ffffff', { anchor: 'end', rot: 3 });
    var r2 = word('HEISS', 1244, 330, 400, 200, YEL, { anchor: 'end', rot: 3 });
    s += l1.svg + l2.svg + r1.svg + r2.svg;
    s += '<circle cx="210" cy="520" r="96" fill="#fbf6ea" stroke="#000" stroke-width="9"/>' + stampX(210, 520, 54, RED);
    s += '<circle cx="1060" cy="510" r="96" fill="#fbf6ea" stroke="#000" stroke-width="9"/>' + check(1066, 516, 56, '#1f9a3e');
  }

  // grain + vignette
  defs += '<radialGradient id="vig" cx="640" cy="360" r="820" gradientUnits="userSpaceOnUse"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>';
  s += '<rect width="1280" height="720" fill="url(#vig)"/>';
  s += '<rect width="1280" height="720" filter="url(#grain)" opacity=".22" style="mix-blend-mode:overlay"/>';
  if (/g/.test(H.slice(1))) s += '<rect x="1140" y="670" width="140" height="50" fill="#f0f" opacity=".5"/>';
  document.getElementById('stage').innerHTML = '<defs>' + defs + S.defs + '</defs>' + s;
})();
</script>
</body>
</html>
